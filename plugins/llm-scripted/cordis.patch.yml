# Bundle patch, used when the package is installed into a profile.
# Registers the `scripted` route (model `script`). `dsd run … --scripted`
# loads it and makes it a throwaway's default model; a named variant has it
# as one more model to pick.
- insert:
    - id: deepsea-llm-scripted
      name: "@deepsea/llm-scripted"
