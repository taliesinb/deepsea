# Bundle patch, used when the package is installed into a profile. Two rows:
# - deepsea-tool-wait (global): the pending waits (service deepseaWait), the
#   announced job_output waits, the routes, the progress-bar row and the
#   job_output countdown (browser half, lib/client.js);
# - deepsea-tool-wait-tools: the `wait` tool and its system-prompt hint. dsd
#   moves it into the agent presets that have @deepseek-ai/dsh-tool-jobs
#   (package.json deepsea.presets) and disables it here.
# Its config (maxSeconds, promptHint) goes on deepsea-tool-wait-tools.
- insert:
    - id: deepsea-tool-wait
      name: "@deepsea/tool-wait"
    - id: deepsea-tool-wait-tools
      name: "@deepsea/tool-wait/tools"
